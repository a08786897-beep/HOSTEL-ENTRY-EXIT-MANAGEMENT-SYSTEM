<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Students | HEMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../STYLE/app.css"></head>
<body data-page="students">
<main class="app-shell">
    <nav class="app-nav d-flex justify-content-between"><a href="dashboard.html" class="fw-bold text-primary">HEMS</a><a href="dashboard.html">Dashboard</a></nav>
    <div id="pageNotice" class="alert" role="status" hidden></div>
    <section class="app-card p-4"><div class="d-flex justify-content-between align-items-center"><div><h1 class="h3">Registered students</h1><p class="text-muted">Student records from the connected database.</p></div><span class="badge text-bg-primary"><span id="studentCount">0</span> students</span></div>
        <label class="visually-hidden" for="studentSearch">Search students</label><input class="form-control mb-3" id="studentSearch" placeholder="Search name, roll number, hostel or room">
        <div class="table-responsive"><table class="table table-hover"><thead><tr><th>Name</th><th>Roll number</th><th>Course</th><th>Hostel</th><th>Room</th><th>Email</th></tr></thead><tbody id="studentRows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div>
    </section>
</main>
<script src="../SCRIPT/api.js"></script><script src="../SCRIPT/portal.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Profile | HEMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../STYLE/app.css"></head>
<body data-page="profile">
<main class="app-shell">
    <nav class="app-nav d-flex justify-content-between"><a href="dashboard.html" class="fw-bold text-primary">HEMS</a><a href="dashboard.html">Dashboard</a></nav>
    <div id="pageNotice" class="alert" role="status" hidden></div>
    <section class="app-card p-4"><h1 class="h3">My profile</h1><p class="text-muted">Update your contact and hostel information.</p>
        <form id="profileForm" class="row g-3">
            <div class="col-md-6"><label class="form-label" for="username">Full name</label><input class="form-control" id="username" name="username" required minlength="2" maxlength="80"></div>
            <div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" readonly></div>
            <div class="col-md-6"><label class="form-label" for="rollNumber">Roll number</label><input class="form-control" id="rollNumber" name="rollNumber" maxlength="40"></div>
            <div class="col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" id="phone" name="phone" maxlength="20"></div>
            <div class="col-md-6"><label class="form-label" for="course">Course</label><input class="form-control" id="course" name="course" maxlength="100"></div>
            <div class="col-md-6"><label class="form-label" for="year">Year</label><input class="form-control" id="year" name="year" maxlength="30"></div>
            <div class="col-md-6"><label class="form-label" for="hostel">Hostel</label><input class="form-control" id="hostel" name="hostel" maxlength="100"></div>
            <div class="col-md-6"><label class="form-label" for="room">Room number</label><input class="form-control" id="room" name="room" maxlength="30"></div>
            <div class="col-12"><div id="profileMessage" class="alert" role="status" aria-live="polite" hidden></div><button class="btn btn-primary" type="submit">Save changes</button></div>
        </form>
    </section>
</main>
<script src="../SCRIPT/api.js"></script><script src="../SCRIPT/portal.js"></script>
</body>
</html>

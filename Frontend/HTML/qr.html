<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gate Pass Verification | HEMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../STYLE/app.css"></head>
<body data-page="qr">
<main class="app-shell">
    <nav class="app-nav d-flex justify-content-between"><a href="dashboard.html" class="fw-bold text-primary">HEMS</a><a href="my-passes.html">My applications</a></nav>
    <div id="pageNotice" class="alert" role="status" hidden></div>
    <section class="app-card p-4 mx-auto text-center" style="max-width:560px">
        <h1 class="h3">Gate pass verification</h1>
        <p class="text-muted">Present this approved pass ID to security. Security staff must verify the live record before recording movement.</p>
        <div class="border rounded-4 p-4 my-4"><img id="passQr" hidden width="240" height="240" alt="QR code for the approved gate pass"><div class="text-muted">Pass ID</div><div class="fs-4 fw-bold text-break" data-pass="passId">Loading…</div></div>
        <div class="d-flex justify-content-between"><span>Type</span><strong data-pass="passType"></strong></div>
        <div class="d-flex justify-content-between mt-2"><span>Destination</span><strong data-pass="destination"></strong></div>
        <div class="d-flex justify-content-between mt-2"><span>Status</span><strong data-pass="status"></strong></div>
        <div class="d-flex justify-content-between mt-2"><span>Valid until</span><strong data-pass="returnAt"></strong></div>
        <button id="downloadPass" class="btn btn-primary mt-4 no-print">Print pass</button>
    </section>
</main>
<script src="../SCRIPT/api.js"></script><script src="../SCRIPT/portal.js"></script>
</body>
</html>

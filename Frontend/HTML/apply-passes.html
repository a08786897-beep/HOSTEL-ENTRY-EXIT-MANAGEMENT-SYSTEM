<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apply for a Gate Pass | HEMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../STYLE/app.css">
</head>
<body data-page="apply">
<main class="app-shell">
    <nav class="app-nav d-flex justify-content-between align-items-center"><a href="dashboard.html" class="fw-bold text-primary">HEMS</a><span><span data-user-name></span> · <a href="my-passes.html">My applications</a></span></nav>
    <div id="pageNotice" class="alert" role="status" hidden></div>
    <h1 class="h3">Apply for a gate pass</h1>
    <p class="text-muted">Your request is submitted to the hostel warden for review.</p>
    <section class="app-card p-4 mb-4"><h2 class="h5">Student information</h2><p class="mb-0" id="studentSummary">Loading profile…</p></section>
    <section class="app-card p-4">
        <form id="gatePassForm">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label" for="passType">Pass type</label><select class="form-select" id="passType" name="passType" required><option value="">Select type</option><option>Home Visit</option><option>Medical</option><option>Personal Work</option><option>Emergency</option><option>Official Work</option></select></div>
                <div class="col-md-6"><label class="form-label" for="destination">Destination</label><input class="form-control" id="destination" name="destination" maxlength="200" required></div>
                <div class="col-md-6"><label class="form-label" for="exitDate">Exit date</label><input class="form-control" type="date" id="exitDate" name="exitDate" required></div>
                <div class="col-md-6"><label class="form-label" for="exitTime">Exit time</label><input class="form-control" type="time" id="exitTime" name="exitTime" required></div>
                <div class="col-md-6"><label class="form-label" for="returnDate">Return date</label><input class="form-control" type="date" id="returnDate" name="returnDate" required></div>
                <div class="col-md-6"><label class="form-label" for="returnTime">Return time</label><input class="form-control" type="time" id="returnTime" name="returnTime" required></div>
                <div class="col-md-6"><label class="form-label" for="parentContact">Parent contact</label><input class="form-control" type="tel" id="parentContact" name="parentContact" minlength="7" maxlength="20" required></div>
                <div class="col-md-6"><label class="form-label" for="emergencyContact">Emergency contact (optional)</label><input class="form-control" type="tel" id="emergencyContact" name="emergencyContact" maxlength="20"></div>
                <div class="col-12"><label class="form-label" for="address">Destination address (optional)</label><input class="form-control" id="address" name="address" maxlength="500"></div>
                <div class="col-12"><label class="form-label" for="reason">Reason for leaving</label><textarea class="form-control" id="reason" name="reason" rows="4" maxlength="1000" required></textarea></div>
                <div class="col-12 form-check ms-2"><input class="form-check-input" id="declaration" type="checkbox" required><label class="form-check-label" for="declaration">I confirm that these details are accurate and will follow hostel rules.</label></div>
                <div class="col-12"><div id="formMessage" class="alert" role="status" aria-live="polite" hidden></div><button class="btn btn-primary" type="submit">Submit application</button><button class="btn btn-outline-secondary ms-2" type="reset">Reset</button></div>
            </div>
        </form>
    </section>
</main>
<script src="../SCRIPT/api.js"></script><script src="../SCRIPT/portal.js"></script>
</body>
</html>

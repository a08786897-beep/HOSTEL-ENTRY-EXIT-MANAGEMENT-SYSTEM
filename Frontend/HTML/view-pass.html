<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gate Pass Details | HEMS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../STYLE/app.css"></head>
<body data-page="pass">
<main class="app-shell">
    <nav class="app-nav d-flex justify-content-between"><a href="dashboard.html" class="fw-bold text-primary">HEMS</a><a href="my-passes.html">My applications</a></nav>
    <div id="pageNotice" class="alert" role="status" hidden></div>
    <section class="app-card p-4">
        <div class="d-flex justify-content-between align-items-center"><h1 class="h3">Gate pass details</h1><span data-pass="status" class="badge bg-secondary"></span></div>
        <div class="row mt-3">
            <div class="col-md-6"><h2 class="h5">Application</h2><dl><dt>Pass ID</dt><dd data-pass="passId"></dd><dt>Type</dt><dd data-pass="passType"></dd><dt>Destination</dt><dd data-pass="destination"></dd><dt>Exit</dt><dd data-pass="exitAt"></dd><dt>Return</dt><dd data-pass="returnAt"></dd><dt>Reason</dt><dd data-pass="reason"></dd><dt>Rejection reason</dt><dd data-pass="rejectionReason"></dd><dt>Movement</dt><dd data-pass="movement"></dd></dl></div>
            <div class="col-md-6"><h2 class="h5">Student</h2><dl><dt>Name</dt><dd data-pass="studentName"></dd><dt>Roll number</dt><dd data-pass="rollNumber"></dd><dt>Hostel</dt><dd data-pass="hostel"></dd><dt>Room</dt><dd data-pass="room"></dd><dt>Phone</dt><dd data-pass="phone"></dd></dl></div>
        </div>
        <a id="qrLink" class="btn btn-outline-primary" href="qr.html">Pass verification</a>
        <button id="downloadPass" class="btn btn-secondary no-print">Print / save pass</button>
    </section>
</main>
<script src="../SCRIPT/api.js"></script><script src="../SCRIPT/portal.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Gate Passes | HEMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../STYLE/app.css">
</head>
<body data-page="passes">
<main class="app-shell">
    <nav class="app-nav d-flex justify-content-between align-items-center"><a href="dashboard.html" class="fw-bold text-primary">HEMS</a><div><span data-user-name></span> · <a href="dashboard.html">Dashboard</a></div></nav>
    <div id="pageNotice" class="alert" role="status" hidden></div>
    <h1 class="h3">My gate pass applications</h1><p class="text-muted">Application status is updated by the hostel team.</p>
    <section class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><article class="app-card p-3"><span>Total</span><div class="stat-value" id="totalPasses">0</div></article></div>
        <div class="col-6 col-lg-3"><article class="app-card p-3"><span>Pending</span><div class="stat-value text-warning" id="pendingPasses">0</div></article></div>
        <div class="col-6 col-lg-3"><article class="app-card p-3"><span>Approved</span><div class="stat-value text-success" id="approvedPasses">0</div></article></div>
        <div class="col-6 col-lg-3"><article class="app-card p-3"><span>Rejected</span><div class="stat-value text-danger" id="rejectedPasses">0</div></article></div>
    </section>
    <section class="app-card p-4">
        <div class="row g-2 mb-3"><div class="col-md-8"><label class="visually-hidden" for="passFilter">Search applications</label><input class="form-control" id="passFilter" placeholder="Search by pass ID, type, or destination"></div><div class="col-md-4"><label class="visually-hidden" for="statusFilter">Filter by status</label><select class="form-select" id="statusFilter"><option value="">All statuses</option><option>Pending</option><option>Approved</option><option>Rejected</option></select></div></div>
        <div class="table-responsive"><table class="table table-hover"><thead><tr><th>Pass ID</th><th>Exit date</th><th>Type</th><th>Destination</th><th>Status</th><th>Details</th></tr></thead><tbody id="passRows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div>
    </section>
</main>
<script src="../SCRIPT/api.js"></script><script src="../SCRIPT/portal.js"></script>
</body>
</html>
